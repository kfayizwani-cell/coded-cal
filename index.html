<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hisab Machine</title>

<style>
    body {
        background: #f5f6fa;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .app {
        width: 350px;
        background: white;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .display {
        width: 100%;
        height: 80px;
        border-radius: 20px;
        border: none;
        font-size: 32px;
        text-align: right;
        padding: 10px;
        margin-bottom: 20px;
        background: #ecf0f1;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
        height: 60px;
        border: none;
        border-radius: 20px;
        font-size: 24px;
        cursor: pointer;
    }

    .num {
        background: #ecf0f1;
    }

    .operator {
        background: #3498db;
        color: white;
    }

    .equal {
        background: #2ecc71;
        color: white;
    }

    .clear {
        width: 100%;
        margin-top: 10px;
        height: 55px;
        background: #e74c3c;
        color: white;
        font-size: 22px;
        border-radius: 20px;
    }

    button:hover {
        opacity: 0.9;
    }
</style>
</head>

<body>

<div class="app">
    <input type="text" id="display" class="display" readonly>

    <div class="grid">
        <button class="num" onclick="add('7')">7</button>
        <button class="num" onclick="add('8')">8</button>
        <button class="num" onclick="add('9')">9</button>
        <button class="operator" onclick="add('/')">/</button>

        <button class="num" onclick="add('4')">4</button>
        <button class="num" onclick="add('5')">5</button>
        <button class="num" onclick="add('6')">6</button>
        <button class="operator" onclick="add('*')">*</button>

        <button class="num" onclick="add('1')">1</button>
        <button class="num" onclick="add('2')">2</button>
        <button class="num" onclick="add('3')">3</button>
        <button class="operator" onclick="add('-')">-</button>

        <button class="num" onclick="add('0')">0</button>
        <button class="num" onclick="add('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
        <button class="operator" onclick="add('+')">+</button>
    </div>

    <button class="clear" onclick="clearDisplay()">CLEAR</button>
</div>

<script>
    function add(value) {
        let display = document.getElementById("display");
        let current = display.value;

        if (current && "+-*/".includes(current.slice(-1)) && "+-*/".includes(value)) {
            return;
        }

        display.value += value;
    }

    function clearDisplay() {
        document.getElementById("display").value = "";
    }

    function calculate() {
        let display = document.getElementById("display");
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
